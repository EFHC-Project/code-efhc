name: CODE EFHC Runtime E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "guard/**"
      - "contracts/**"
      - "requirements.txt"
      - "tests/test_api.py"
      - "tests/test_intake.py"
      - "tests/e2e_remote.py"
      - ".github/workflows/runtime-e2e.yml"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run local runtime contract tests
        run: python -m unittest tests.test_api tests.test_intake tests.test_frontend
      - name: Run public MCP/Railway E2E
        env:
          CODE_EFHC_RUNTIME_URL: https://code-efhc-quality-gate-production.up.railway.app
        run: python tests/e2e_remote.py
